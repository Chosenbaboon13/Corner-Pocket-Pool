<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corner Pocket Pool</title>
<style>
:root{color-scheme:dark;--bg:#16110e;--pan:#241b15;--ink:#f4ead8;--mute:#a39379;--acc:#f0b94a;--bad:#e8573f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
#app{max-width:1000px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.hud{display:grid;grid-template-columns:1fr 150px 1fr;gap:8px;align-items:stretch}
.pl{background:var(--pan);border:2px solid transparent;border-radius:10px;padding:8px 12px;min-width:0}
.pl.on{border-color:var(--acc)}
.pl.r{text-align:right}
.nm{font-size:18px;font-weight:bold}.gr{color:var(--mute);font-size:13px;margin:2px 0 6px}
.dots{display:flex;gap:3px;flex-wrap:wrap;min-height:14px}.pl.r .dots{justify-content:flex-end}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--c);border:1px solid #0006}
.dots i.x{opacity:.18}
.mid{background:var(--pan);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px}
#tn{font-size:30px;font-weight:bold;line-height:1}#tn.w{color:var(--bad)}
.bar{height:6px;background:#0005;border-radius:3px;overflow:hidden}#tb{height:100%;background:var(--acc);width:100%}
.mini{display:flex;gap:6px;justify-content:center}
button{font:inherit;color:var(--ink);cursor:pointer}
.mini button{background:#0004;border:1px solid #fff2;border-radius:6px;padding:3px 8px;font-size:13px}
.wrap{position:relative}
canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:14px;box-shadow:0 8px 30px #000a}
#st{text-align:center;color:var(--mute);min-height:22px;font-size:15px}#st.m{color:var(--acc)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;border-radius:14px;padding:12px}
.ov.h{display:none}
.card{background:var(--pan);border:1px solid #fff2;border-radius:16px;padding:22px 26px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:38px;letter-spacing:.5px}h2{margin:0;font-size:30px}
.sub{margin:0;color:var(--mute)}
.big{background:var(--acc);color:#1b1208;border:0;border-radius:10px;padding:13px;font-size:18px;font-weight:bold}
.big.alt{background:#3b7d52;color:#fff}.big.g{background:#0004;color:var(--ink);border:1px solid #fff3}
.seg{display:flex;gap:6px;justify-content:center}.seg button{flex:1;background:#0004;border:1px solid #fff2;border-radius:8px;padding:7px}
.seg button.on{background:var(--acc);color:#1b1208;font-weight:bold}
.how{margin:0;padding-left:18px;text-align:left;color:var(--mute);font-size:14px;line-height:1.5}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:640px){.hud{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;order:-1;flex-direction:row;align-items:center;justify-content:space-between}.bar{flex:1}.nm{font-size:15px}h1{font-size:30px}.card{padding:16px}.how{font-size:13px}}
</style></head><body>
<div id="app">
 <div class="hud">
  <div class="pl" id="p0"></div>
  <div class="mid"><div id="tn">30</div><div class="bar"><div id="tb"></div></div><div class="mini"><button id="bm">Menu</button><button id="bs">Sound on</button></div></div>
  <div class="pl r" id="p1"></div>
 </div>
 <div class="wrap">
  <canvas id="c" width="1920" height="1040"></canvas>
  <div class="ov" id="menu"><div class="card">
   <h1>Corner Pocket Pool</h1><p class="sub">Eight-ball for one or two players</p>
   <button class="big" data-m="cpu">Play the CPU</button>
   <div class="seg" id="diff"><button data-d="0">Easy</button><button data-d="1" class="on">Medium</button><button data-d="2">Hard</button></div>
   <button class="big alt" data-m="pvp">Two players, one device</button>
   <ul class="how"><li>Drag back from anywhere, then release to shoot. Farther is harder.</li><li>Pot all of your group (solids or stripes), then the 8-ball.</li><li>You have 30 seconds per shot. A foul gives your opponent the cue ball in hand.</li></ul>
  </div></div>
  <div class="ov h" id="over"><div class="card"><h2 id="ot"></h2><p class="sub" id="od"></p><button class="big" id="rm">Rematch</button><button class="big g" id="om">Main menu</button></div></div>
 </div>
 <div id="st"></div>
</div>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d");ctx.scale(2,2);
const W=960,H=520,L=50,R=910,T=50,B=470,r=10.5,CY=(T+B)/2,FX=L+(R-L)*.7,TURN=30;
const PK=[[L-6,T-6,24],[R+6,T-6,24],[L-6,B+6,24],[R+6,B+6,24],[480,T-10,25],[480,B+10,25]];
const COL=["#f4f0e6","#f5c400","#1e4fd8","#e0262b","#6a2a9c","#f57a00","#0b8a45","#8a2020","#141414"];
const col=n=>COL[n>8?n-8:n],grp=n=>n<8?0:n>8?1:2;
const $=id=>document.getElementById(id);
const S={mode:"cpu",diff:1,state:"menu",balls:[],turn:0,groups:[null,null],time:TURN,drag:null,mouse:{x:480,y:260},msg:"",msgT:0,first:null,pot:[],hand:false,cpuT:0,cpuShot:null};
let ac=null,mute=false;
const rnd=Math.random,gauss=()=>(rnd()+rnd()+rnd()-1.5)*2;
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const human=()=>S.mode=="pvp"||S.turn==0;
const name=i=>S.mode=="cpu"?(i?"CPU":"You"):"Player "+(i+1);
function beep(f,v){if(!ac||mute)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.value=.07*Math.min(1,v);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.08);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}
function say(t){S.msg=t;S.msgT=2.8}

function newGame(){
 const so=sh([1,2,3,4,5,6,7]),st=sh([9,10,11,12,13,14,15]);
 const rest=sh([...so.slice(1),...st.slice(1)]),o=[];o[4]=8;o[10]=so[0];o[14]=st[0];
 let k=0;for(let i=0;i<15;i++)if(o[i]==null)o[i]=rest[k++];
 S.balls=[{n:0,x:L+215,y:CY,vx:0,vy:0,in:0}];
 let i=0;for(let row=0;row<5;row++)for(let j=0;j<=row;j++)S.balls.push({n:o[i++],x:FX+row*(r*1.74+.3),y:CY+(j-row/2)*(2*r+.4),vx:0,vy:0,in:0});
 S.turn=0;S.groups=[null,null];S.hand=false;S.sig="";
}
function start(mode){S.mode=mode;newGame();$("menu").classList.add("h");$("over").classList.add("h");say("Break! Player "+(mode=="cpu"?"— you":"1")+" shoots first");beginTurn()}
function showMenu(){S.state="menu";$("menu").classList.remove("h");$("over").classList.add("h")}

function valid(x,y){return x>=L+r&&x<=R-r&&y>=T+r&&y<=B-r&&!S.balls.some(b=>b.n&&!b.in&&Math.hypot(b.x-x,b.y-y)<2*r+1)}
function sd(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
function blocked(x1,y1,x2,y2,ex){return S.balls.some(b=>!b.in&&b.n&&b!==ex&&sd(b.x,b.y,x1,y1,x2,y2)<2*r-1)}
function targets(p){
 const live=S.balls.filter(b=>b.n&&!b.in),g=S.groups[p];
 if(g==null)return live.filter(b=>b.n!=8);
 const own=live.filter(b=>grp(b.n)==g);return own.length?own:live.filter(b=>b.n==8);
}
function plan(c){
 const tg=targets(S.turn);let best=null;
 for(const t of tg)for(const p of PK){
  const px=p[0]+(p[0]<480?10:p[0]>480?-10:0),py=p[1]+(p[1]<CY?10:-10);
  const ux=px-t.x,uy=py-t.y,ul=Math.hypot(ux,uy),gx=t.x-ux/ul*2*r,gy=t.y-uy/ul*2*r;
  const dx=gx-c.x,dy=gy-c.y,dl=Math.hypot(dx,dy);if(dl<1)continue;
  const cut=(dx*ux+dy*uy)/(dl*ul);if(cut<.25)continue;
  if(blocked(c.x,c.y,gx,gy,t)||blocked(t.x,t.y,px,py,t))continue;
  const sc=cut*2-(dl+ul)/900;
  if(!best||sc>best.sc)best={sc,a:Math.atan2(dy,dx),f:Math.min(.95,Math.max(.3,.3+(dl+ul)/1300))};
 }
 if(!best&&tg.length){let t=tg[0],m=1e9;for(const b of tg){const d=Math.hypot(b.x-c.x,b.y-c.y);if(d<m){m=d;t=b}}best={sc:-9,a:Math.atan2(t.y-c.y,t.x-c.x),f:.55}}
 return best;
}
function beginTurn(){
 S.time=TURN;S.drag=null;
 if(S.mode=="cpu"&&S.turn==1){
  const c=S.balls[0];
  if(S.hand){let best=null;
   for(let i=0;i<70;i++){const x=L+r+rnd()*(R-L-2*r),y=T+r+rnd()*(B-T-2*r);if(!valid(x,y))continue;const s=plan({x,y});if(s&&(!best||s.sc>best.s.sc))best={x,y,s}}
   if(best){c.x=best.x;c.y=best.y}else{c.x=L+215;c.y=CY}
   c.in=0;S.hand=false}
  S.cpuShot=plan(c)||{a:rnd()*6.28,f:.5};S.cpuT=1.2;S.state="cpu";
 }else S.state=S.hand?"place":"aim";
}
function fire(a,f){
 const c=S.balls[0],sp=.5+6.2*Math.max(0,Math.min(1,f));
 c.vx=Math.cos(a)*sp;c.vy=Math.sin(a)*sp;S.state="roll";S.first=null;S.pot=[];S.drag=null;beep(180,1);
}
function sub(){
 const bs=S.balls;
 for(const b of bs){
  if(b.in)continue;b.x+=b.vx;b.y+=b.vy;
  if(b.x<L+r){b.x=L+r;b.vx=Math.abs(b.vx)*.82;beep(120,.4)}else if(b.x>R-r){b.x=R-r;b.vx=-Math.abs(b.vx)*.82;beep(120,.4)}
  if(b.y<T+r){b.y=T+r;b.vy=Math.abs(b.vy)*.82}else if(b.y>B-r){b.y=B-r;b.vy=-Math.abs(b.vy)*.82}
  for(const p of PK)if(Math.hypot(b.x-p[0],b.y-p[1])<p[2]){b.in=1;b.vx=b.vy=0;S.pot.push(b.n);beep(90,1);break}
  const sp=Math.hypot(b.vx,b.vy);
  if(sp<.04){b.vx=b.vy=0}else{const k=Math.max(0,sp*.9975-.006)/sp;b.vx*=k;b.vy*=k}
 }
 for(let i=0;i<bs.length;i++){const a=bs[i];if(a.in)continue;
  for(let j=i+1;j<bs.length;j++){const b=bs[j];if(b.in)continue;
   const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*r*r||d2==0)continue;
   const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*r-d)/2;
   a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
   const rv=((a.vx-b.vx)*nx+(a.vy-b.vy)*ny)*.98;
   if(rv>0){a.vx-=rv*nx;a.vy-=rv*ny;b.vx+=rv*nx;b.vy+=rv*ny;beep(520,rv/4);
    if(S.first==null&&a.n==0)S.first=b.n}
  }}
}
function step(){for(let s=0;s<4;s++)sub();if(S.state=="roll"&&S.balls.every(b=>b.in||(b.vx==0&&b.vy==0)))endShot()}
function respot8(){const b=S.balls.find(x=>x.n==8);b.in=0;b.x=FX;b.y=CY;while(S.balls.some(o=>o!==b&&!o.in&&Math.hypot(o.x-b.x,o.y-b.y)<2*r))b.x+=2*r}
function endShot(){
 const me=S.turn,c=S.balls[0],pl=S.pot,potted=pl.filter(n=>n),scr=c.in;
 let g=S.groups[me],foul=scr,why=scr?"scratched":"";
 const before=g==null?1:S.balls.filter(b=>b.n&&grp(b.n)==g&&(!b.in||pl.includes(b.n))).length;
 const cleared=g!=null&&before==0;
 if(S.first==null){foul=true;why=why||"missed every ball"}
 else if(g==null?S.first==8:cleared?S.first!=8:grp(S.first)!=g){foul=true;why=why||"hit the wrong ball first"}
 if(potted.includes(8)){
  if(g==null){respot8();foul=true;why=why||"potted the 8-ball on an open table"}
  else{const ok=cleared&&!foul;over(ok?me:1-me,ok?name(me)+(me==0&&S.mode=="cpu"?" cleared the table":" cleared the table"):name(me)+(scr?" scratched on the 8-ball":" potted the 8-ball too early"));return}
 }
 if(g==null&&!foul){const f=potted.find(n=>n!=8);if(f!=null){g=grp(f);S.groups[me]=g;S.groups[1-me]=1-g;say(name(me)+(me==0&&S.mode=="cpu"?" are ":" is ")+(g?"stripes":"solids"))}}
 const own=g!=null&&potted.some(n=>grp(n)==g);
 if(scr){c.in=0;c.vx=c.vy=0;c.x=L+215;c.y=CY}
 if(!foul&&own){if(S.msgT<=0)say("Nice shot. Shoot again");S.hand=false}
 else{S.turn=1-me;S.hand=foul;say(foul?name(me)+" "+why+" — ball in hand for "+name(1-me):name(1-me)+(S.mode=="cpu"&&me==0?" is up":"’s turn"))}
 if(S.state=="roll")beginTurn();
}
function over(w,why){S.state="over";$("ot").textContent=name(w)+(name(w)=="You"?" win!":" wins!");$("od").textContent=why+".";$("over").classList.remove("h")}
function timeout(){
 say("Time’s up! Ball in hand for "+name(1-S.turn));S.turn=1-S.turn;S.hand=true;beginTurn();
}

function tick(d){
 if(S.msgT>0)S.msgT-=d;
 if(S.state=="roll")step();
 else if((S.state=="aim"||S.state=="place")&&human()){S.time-=d;if(S.time<=0)timeout()}
 else if(S.state=="cpu"){S.cpuT-=d;if(S.cpuT<=0){const s=S.cpuShot,sg=[.05,.02,.006][S.diff];fire(s.a+gauss()*sg,Math.min(1,Math.max(.2,s.f+(rnd()-.5)*.08)))}}
}

/* ---------- drawing ---------- */
function ball(b,x,y){
 ctx.save();ctx.translate(x,y);
 ctx.beginPath();ctx.arc(2,3,r,0,7);ctx.fillStyle="rgba(0,0,0,.3)";ctx.fill();
 ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
 ctx.fillStyle=b.n>8?"#f4f0e6":col(b.n);ctx.fillRect(-r,-r,2*r,2*r);
 if(b.n>8){ctx.fillStyle=col(b.n);ctx.fillRect(-r,-r*.55,2*r,r*1.1)}
 if(b.n){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,r*.48,0,7);ctx.fill();ctx.fillStyle="#111";ctx.font="bold 8px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.n,0,.5)}
 const g=ctx.createRadialGradient(-3,-4,1,0,0,r);g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(.4,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(0,0,0,.35)");
 ctx.fillStyle=g;ctx.fillRect(-r,-r,2*r,2*r);ctx.restore();
}
function ray(c,a){
 const dx=Math.cos(a),dy=Math.sin(a);let t=1e9,hit=null;
 if(dx>0)t=Math.min(t,(R-r-c.x)/dx);else if(dx<0)t=Math.min(t,(L+r-c.x)/dx);
 if(dy>0)t=Math.min(t,(B-r-c.y)/dy);else if(dy<0)t=Math.min(t,(T+r-c.y)/dy);
 for(const b of S.balls){if(b.in||!b.n)continue;const px=b.x-c.x,py=b.y-c.y,pr=px*dx+py*dy;if(pr<=0)continue;
  const pp=px*px+py*py-pr*pr;if(pp<4*r*r){const tt=pr-Math.sqrt(4*r*r-pp);if(tt<t){t=tt;hit=b}}}
 return{t,hit,dx,dy};
}
function drawAim(c,a,f){
 const q=ray(c,a),ex=c.x+q.dx*q.t,ey=c.y+q.dy*q.t;
 ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.arc(ex,ey,r,0,7);ctx.stroke();
 if(q.hit){const nx=q.hit.x-ex,ny=q.hit.y-ey,l=Math.hypot(nx,ny);ctx.strokeStyle="rgba(240,185,74,.9)";ctx.beginPath();ctx.moveTo(q.hit.x,q.hit.y);ctx.lineTo(q.hit.x+nx/l*70,q.hit.y+ny/l*70);ctx.stroke()}
 const bx=c.x-q.dx*(r+5+f*70),by=c.y-q.dy*(r+5+f*70);
 ctx.lineCap="round";ctx.strokeStyle="#7a4a22";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-q.dx*280,by-q.dy*280);ctx.stroke();
 ctx.strokeStyle="#e8c88a";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-q.dx*150,by-q.dy*150);ctx.stroke();
 ctx.strokeStyle="#5aa7d6";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-q.dx*5,by-q.dy*5);ctx.stroke();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#6b3d1d");g.addColorStop(.5,"#8a5128");g.addColorStop(1,"#5c3217");
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,0,W,H,26);ctx.fill();
 ctx.fillStyle="#e9c98a";
 for(let k=1;k<8;k++)if(k!=4){const x=L+(R-L)*k/8;for(const y of[T-30,B+30]){ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}}
 for(let k=1;k<4;k++){const y=T+(B-T)*k/4;for(const x of[L-30,R+30]){ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}}
 ctx.fillStyle="#1b5e33";ctx.fillRect(L-16,T-16,R-L+32,B-T+32);
 g=ctx.createRadialGradient(480,CY,60,480,CY,520);g.addColorStop(0,"#34a35f");g.addColorStop(1,"#1f7544");
 ctx.fillStyle=g;ctx.fillRect(L,T,R-L,B-T);
 ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L+215,T);ctx.lineTo(L+215,B);ctx.stroke();
 for(const p of PK){ctx.fillStyle="#070504";ctx.beginPath();ctx.arc(p[0],p[1],p[2]-5,0,7);ctx.fill()}
 const c=S.balls[0],hp=S.state=="place"&&human();
 for(const b of S.balls){if(b.in||(hp&&b.n==0))continue;ball(b,b.x,b.y)}
 if(hp){const x=Math.max(L+r,Math.min(R-r,S.mouse.x)),y=Math.max(T+r,Math.min(B-r,S.mouse.y));ctx.globalAlpha=valid(x,y)?.8:.3;ball(c,x,y);ctx.globalAlpha=1}
 if(S.state=="aim"&&human()&&S.drag){
  const v={x:S.drag.sx-S.drag.x,y:S.drag.sy-S.drag.y},l=Math.hypot(v.x,v.y);
  if(l>12){const f=Math.min(l,160)/160;drawAim(c,Math.atan2(v.y,v.x),f);
   ctx.fillStyle="#0007";ctx.fillRect(L,B+28,200,8);ctx.fillStyle=f>.8?"#e8573f":"#f0b94a";ctx.fillRect(L,B+28,200*f,8)}
 }else if(S.state=="cpu"&&S.cpuShot)drawAim(c,S.cpuShot.a,S.cpuShot.f);
}

/* ---------- HUD ---------- */
function hud(){
 const sig=S.turn+"|"+S.groups+"|"+S.mode+"|"+S.balls.map(b=>b.in?1:0).join("");
 if(sig!=S.sig){S.sig=sig;
  for(let i=0;i<2;i++){const g=S.groups[i],el=$("p"+i);el.classList.toggle("on",S.turn==i&&S.state!="menu");
   let d="";if(g!=null)for(const b of S.balls){if(b.n&&b.n!=8&&grp(b.n)==g)d+=`<i class="${b.in?"x":""}" style="--c:${col(b.n)}${g?";background:linear-gradient(#f4f0e6 28%,"+col(b.n)+" 28% 72%,#f4f0e6 72%)":""}"></i>`}
   el.innerHTML=`<div class="nm">${name(i)}</div><div class="gr">${g==null?"Open table":g?"Stripes":"Solids"}</div><div class="dots">${d}</div>`}
 }
 const cpu=S.state=="cpu";
 $("tn").textContent=cpu?"CPU":Math.max(0,Math.ceil(S.time));$("tn").className=!cpu&&S.time<=8?"w":"";
 $("tb").style.width=(cpu?100:Math.max(0,S.time/TURN*100))+"%";
 let t=S.msgT>0?S.msg:S.state=="aim"?(human()?"Drag back from anywhere, then release to shoot":""):S.state=="place"?"Ball in hand: tap the table to place the cue ball":cpu?"CPU is lining up a shot…":"";
 if($("st").textContent!=t){$("st").textContent=t}$("st").className=S.msgT>0?"m":"";
}

/* ---------- input ---------- */
const pt=e=>{const q=cv.getBoundingClientRect();return{x:(e.clientX-q.left)*W/q.width,y:(e.clientY-q.top)*H/q.height}};
cv.addEventListener("pointerdown",e=>{
 if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
 const p=pt(e);S.mouse=p;
 if(S.state=="place"&&human()){if(valid(p.x,p.y)){const c=S.balls[0];c.x=p.x;c.y=p.y;c.in=0;S.hand=false;S.state="aim"}}
 else if(S.state=="aim"&&human()){S.drag={sx:p.x,sy:p.y,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId)}
});
cv.addEventListener("pointermove",e=>{const p=pt(e);S.mouse=p;if(S.drag){S.drag.x=p.x;S.drag.y=p.y}});
cv.addEventListener("pointerup",e=>{
 const d=S.drag;if(!d||S.state!="aim")return;S.drag=null;
 const vx=d.sx-d.x,vy=d.sy-d.y,l=Math.hypot(vx,vy);if(l>12)fire(Math.atan2(vy,vx),Math.min(l,160)/160);
});
cv.addEventListener("pointercancel",()=>{S.drag=null});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
document.querySelectorAll("#diff button").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;document.querySelectorAll("#diff button").forEach(x=>x.classList.toggle("on",x===b))});
$("rm").onclick=()=>start(S.mode);$("om").onclick=showMenu;$("bm").onclick=showMenu;
$("bs").onclick=()=>{mute=!mute;$("bs").textContent=mute?"Sound off":"Sound on"};

newGame();S.state="menu";
let last=0,acc=0;
function loop(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;acc+=dt;
 while(acc>=1/60){acc-=1/60;tick(1/60)}
 draw();hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
